name: Keep Streamlit app awake

# Community Cloud puts an app to sleep after about 12 hours without a visit. A browser visit
# keeps it awake and keeps its data cache warm for real visitors.
#
# GitHub delays or skips scheduled runs when it is busy. With a 6-hour schedule only about two
# runs a day actually happened (gaps of 12+ hours), which let the app fall asleep anyway, so this
# asks for a visit every 2 hours. Each run takes about a minute and is free on a public repo.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Playwright
      run: |
        pip install playwright
        python -m playwright install --with-deps chromium

    - name: Visit the app
      run: python .github/scripts/keep_awake.py
      env:
        APP_URL: https://stattrick.streamlit.app/

    - name: Upload screenshot on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: keep-awake-failure
        path: keep_awake_failure.png
