name: Time app first run against Neon (temporary)
on:
  push:
    branches: [claude/diagnose-app-loading]
jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - run: pip install -r frontend/requirements.txt
    - env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python .github/diag/time_app.py
