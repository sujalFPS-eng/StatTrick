name: StatTrick MLOps Engine

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  retrain-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Display Server for SeleniumBase
      run: sudo apt-get install -y xvfb dbus-x11

    - name: Stage 0A - Ingest Live Tactical Data (FBref)
      run: xvfb-run python src/ingest_fbref.py

    - name: Stage 0B - Ingest Financials and Valuation History (Transfermarkt)
      run: python src/ingest_valuations.py
      env:
        ALLOW_STALE_TM: "1"

    - name: Stage 0C - Ingest xG and xA (Understat)
      run: python src/ingest_understat.py
      continue-on-error: true

    - name: Stage 1 - Run Valuation Pipeline
      run: python src/valuation_model.py
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Stage 2 - Update Tactical Clusters
      run: python src/system_fit.py
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Commit and Push Updated Artifacts
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 MLOps: Automated model retraining and data artifact sync" && git push)